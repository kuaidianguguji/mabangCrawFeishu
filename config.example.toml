# 复制为 config.toml；相对路径均以配置文件所在目录为基准。
[account]
username = ""
password = ""
# 可用环境变量 MABANG_USERNAME / MABANG_PASSWORD 覆盖。

[browser]
executable = "" # 留空自动寻找 Chrome，也可填写固定 chrome.exe 路径
profile_dir = "storage_logininfo/browser-profile" # 固定 Chrome 用户目录，保留 Cookie、localStorage 等
login_info_dir = "storage_logininfo" # 保存 Cookie / sessionStorage 快照，每次启动自动恢复
legacy_profile_dir = "runtime/browser-profile" # 新目录不存在时从旧目录复制一次；留空禁用迁移
port = 9333
headless = false
language = "zh-CN"
window_size = "1440,1000"
user_agent = "" # 留空使用浏览器真实 UA
close_on_exit = true

[mabang]
home_url = "https://www.mabangerp.com/index.htm"
dashboard_url = "https://www.mabangerp.com/index.php?mod=main.cloudbi"
api_base = "https://mas-oapi.mabangerp.com/mas-report-biscreen-service/api/biscreen/v1/modules/"
# 登录成功通过 mb-user 元素判断，不依赖 URL。
logged_in_url_pattern = "" # 兼容旧配置保留，不再用于判断登录
logged_in_xpath = '//div[@id="mb-user"]' # 此元素存在即登录成功
login_link_xpath = '//a[@id="login-btn"]'
username_xpath = '//input[@id="account"]'
password_xpath = '//input[@id="password"]'
submit_xpath = '//input[@id="account-btn"]'
timezone_text = "UTC-3"
timezone_button_xpath = '//section//div[@data-filter="timezone"]//button'
timezone_option_xpath = '//section//div[@role="listbox"]//button[contains(@title, "UTC-3")]'
timezone_list_xpath = '//section//div[@role="listbox"]'

[timing]
element_timeout = 15
page_timeout = 45
login_timeout = 120 # 登录入口、表单出现及一般登录确认的最长秒数
post_submit_timeout = 180 # 点击提交后额外等待成功标志，适应登录接口慢/验证码回调
capture_timeout = 60 # 每轮监听的总等待秒数
poll_interval = 0.5
retry_count = 2 # 单轮采集内部补齐接口的额外次数；与 retry.before_capture 整体重试独立
retry_interval = 3

# 以下 count 均为“额外重试次数”，0 表示只执行一次；interval 单位为秒，可为 0。
# 各层独立计数，整体重试会重新获得内部重试预算，因此最坏等待时间可能叠加。
# 页面单次等待由 timing.page_timeout 控制；按钮由 element_timeout 控制；飞书由 feishu.timeout 控制。
[retry.button]
count = 2 # 点击异常或明确返回 False 时，重新定位后点击；已达到目标状态则不重复点击
interval = 1

[retry.page]
count = 2 # 首页/看板加载异常或返回 False 时重新进入页面；看板每次先重启监听
interval = 3

[retry.feishu]
count = 3 # 飞书网络异常、HTTP 408/429/5xx、临时业务错误重试；字段/权限错误不重试
interval = 5 # 新增请求保持相同 client_token，避免响应丢失导致重复创建

[retry.before_capture]
count = 2 # 八个 JSON 尚未收齐：浏览器启动、登录、时区切换、采集整体重试
interval = 10 # 重启本次专用浏览器后再尝试；保留每次失败目录，禁止跨整体轮次混用 JSON

[retry.after_capture]
count = 2 # JSON 已收齐：清洗、保存、飞书同步遇到意外异常时，用同一批数据整体重试
interval = 10 # 不重新打开浏览器采集；飞书重跑前重新查询，已成功且未变化的记录跳过

[output]
directory = "output"

[schedule]
times = ["09:55"] # 北京时间，支持多个 HH:MM，例如 ["09:00", "18:00"]
poll_interval = 5 # 检查时间的间隔秒数，1～60
state_dir = "runtime/scheduler" # 保存防重记录及常驻日志

[feishu]
enabled = false # 配齐凭证、表 ID、字段后设 true，collect 将自动同步
app_id = ""
app_secret = "" # 也可用 FEISHU_APP_ID / FEISHU_APP_SECRET 环境变量
app_token = "" # 多维表格 app_token，不是应用 app_id
timeout = 30
formula_source_prefix = "马帮-" # 同名业务列为公式时，源值写入此前缀的数字列

[feishu.tables]
products = "" # 每日商品榜单 table_id
shops = "" # 每日店铺表现 table_id
managers = "" # 每日管理员表现 table_id
platforms = "" # 每日平台销售 table_id
summary = "" # 每日经营汇总 table_id
hourly = "" # 每日每时销售额 table_id

[feishu.sync]
compare_yesterday = false
correct_day_before_yesterday = false
backfill_sales_trend = false
timezone = "Asia/Shanghai"
business_timezone = "Asia/Shanghai" # 飞书“日期”按北京时间填写
source_timezone = "Etc/GMT+3" # 看板实际统计时区：固定 UTC-3
currency = "CNY"
# 请在马帮看板固定筛选；此标签仅记录口径，不会替你切换看板。
scope = "全平台"

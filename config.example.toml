# 复制为 config.toml；相对路径均以配置文件所在目录为基准。
[account]
username = ""
password = ""
# 可用环境变量 MABANG_USERNAME / MABANG_PASSWORD 覆盖。

[browser]
executable = "" # 留空自动寻找 Chrome，也可填写固定 chrome.exe 路径
profile_dir = "runtime/browser-profile"
port = 9333
headless = false
language = "zh-CN"
window_size = "1440,1000"
user_agent = "" # 留空使用浏览器真实 UA
close_on_exit = true

[mabang]
home_url = "https://www.mabangerp.com/index.htm"
dashboard_url = "https://www.mabangerp.com/index.php?mod=main.cloudbi"
api_base = "https://mas-oapi.mabangerp.com/mas-report-biscreen-service/api/biscreen/v1/modules/"
# 登录成功通过 mb-user 元素判断，不依赖 URL。
logged_in_url_pattern = "" # 兼容旧配置保留，不再用于判断登录
logged_in_xpath = '//div[@id="mb-user"]' # 此元素存在即登录成功
login_link_xpath = '//a[@id="login-btn"]'
username_xpath = '//input[@id="account"]'
password_xpath = '//input[@id="password"]'
submit_xpath = '//input[@id="account-btn"]'

[timing]
element_timeout = 15
page_timeout = 45
login_timeout = 120 # 有验证码时可在浏览器手动完成
capture_timeout = 60 # 每轮监听的总等待秒数
poll_interval = 0.5
retry_count = 2 # 额外重试次数，仅用于采集；不反复提交密码
retry_interval = 3

[output]
directory = "output"
